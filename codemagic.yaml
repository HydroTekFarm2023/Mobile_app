workflows:
  android-build:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - amplify_secrets
    scripts:
      - name: Write secret config files
        script: |
          echo "$AMPLIFY_CONFIG_DART" > lib/amplifyconfiguration.dart
          echo "$ENV_FILE_CONTENT" > .env
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android APK (debug)
        script: flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk

  ios-build:
    name: iOS Build (Simulator)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - amplify_secrets
    scripts:
      - name: Write secret config files
        script: |
          echo "$AMPLIFY_CONFIG_DART" > lib/amplifyconfiguration.dart
          echo "$ENV_FILE_CONTENT" > .env
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS (simulator, no signing)
        script: flutter build ios --debug --no-codesign --simulator
    artifacts:
      - build/ios/iphonesimulator/*.app
